name: "TIS Controller Bridge"
version: "1.0.8"
slug: "tis_bridge"
description: "Bridges TIS Control UDP broadcasts (water meter, motion sensors) to MQTT with Home Assistant auto-discovery"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
startup: services
boot: auto
init: false
# Required so the container shares the host's network interface directly --
# UDP broadcast traffic from the TIS controller will not be received through
# Docker's default bridge networking. The Home Assistant host itself must be
# physically on the same network/VLAN as the TIS controller for this to work
# at all, same requirement as running the script standalone.
host_network: true
# The Supervisor `services: mqtt:want` auto-injection mechanism did not
# provide credentials in testing, so MQTT connection details are configured
# manually below instead of relying on it.
options:
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  controller_ip: "192.168.6.200"
  poll_interval: 60
schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  controller_ip: str
  poll_interval: int(5,)
